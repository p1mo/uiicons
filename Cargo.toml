[package]
name    = "uiicons"
version = "0.1.1"
edition = "2021"
description = "ui svg icons"
license = "MIT OR Apache-2.0"
repository = "https://github.com/p1mo/uiicons"
readme = "README.md"
keywords = ["ui", "icons", "js", "svg"]
categories = ["development-tools"]
authors = ["p1mo <101986259+p1mo@users.noreply.github.com>"]

[package.metadata.docs.rs]
no-default-features = true
features = [
  "build",
  "js",
]


[features]
default = []
build = [ "dep:serde", "dep:serde_json", "dep:zip", "dep:jwalk", "dep:schemars", "dep:git2", "dep:blake3", "dep:reqwest" ]
js = []

[dependencies]
thiserror = "2.0.19"

speedy = "0.8.7"
rayon  = "1.12.0"

serde = { version = "1.0.229", optional = true, features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }
zip = { version = "8.6.0", optional = true }
jwalk = { version = "0.9.0", optional = true }
schemars = { version = "1.0.229", optional = true }
git2 = { version = "0.21.0", optional = true, default-features = false, features = ["https"] }
blake3 = { version = "1.8.3", optional = true }
reqwest = { version = "0.13.4", optional = true, features = ["json", "blocking", "stream"] }